<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plan technique</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        grid-template: auto 1fr auto / 230px 1fr;
        grid-template-areas: 'haut haut' 'cote plan' 'bas bas';
        font: 14px/1.4 system-ui, sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }
      header { grid-area: haut; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 6px 12px; background: #fff; border-bottom: 1px solid #d1d5db; }
      header strong { margin-right: 4px; }
      .groupe { display: flex; gap: 4px; align-items: center; }
      button, .btn { font: inherit; color: inherit; padding: 4px 10px; border: 1px solid #9ca3af; border-radius: 6px; background: #fff; cursor: pointer; }
      button:hover, .btn:hover { background: #f3f4f6; }
      button:focus-visible, .btn:focus-within, summary:focus-visible { outline: 2px solid #2563eb; outline-offset: 1px; }
      .icone { min-width: 32px; padding: 4px 6px; text-align: center; }
      .principal { background: #1d4ed8; border-color: #1d4ed8; color: #fff; font-weight: 600; }
      .principal:hover { background: #1e40af; }
      .vh { position: absolute; width: 1px; height: 1px; opacity: 0; }
      aside { grid-area: cote; overflow-y: auto; padding: 8px 12px; background: #fff; border-right: 1px solid #d1d5db; }
      aside > details { border-bottom: 1px solid #e5e7eb; padding-bottom: 6px; margin-bottom: 6px; }
      summary { cursor: pointer; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #6b7280; padding: 4px 0; }
      #palette summary { text-transform: none; letter-spacing: 0; font-size: 13px; }
      aside label { display: block; margin: 3px 0; }
      aside input[type='range'] { width: 100%; }
      main { position: relative; grid-area: plan; overflow: hidden; min-width: 0; min-height: 0; background: #fff; }
      #plan { position: absolute; inset: 0; } /* Konva vide son conteneur : le panneau Propriétés reste à côté */
      /* Propriétés : panneau flottant, affiché seulement quand un élément est sélectionné. */
      #props { position: absolute; z-index: 1; top: 12px; right: 12px; width: 230px; padding: 10px 12px; font-size: 13px; color: #4b5563; background: #fff; border: 1px solid #d1d5db; border-radius: 8px; box-shadow: 0 4px 14px rgb(0 0 0 / 0.12); }
      #props[hidden] { display: none; }
      #props strong { display: block; color: #1f2937; margin-bottom: 4px; }
      #props label { display: block; margin: 6px 0 0; }
      #props input { width: 100%; font: inherit; padding: 3px 6px; border: 1px solid #9ca3af; border-radius: 4px; }
      #props p { margin: 6px 0 0; }
      #palette button { display: flex; align-items: center; gap: 8px; width: 100%; margin: 2px 0; padding: 3px 8px; text-align: left; border-color: transparent; }
      #palette button.actif { border-color: currentColor; background: #eff6ff; }
      #palette svg { width: 26px; height: 26px; flex: none; }
      #palette span { color: #1f2937; }
      footer { grid-area: bas; display: flex; justify-content: space-between; gap: 12px; padding: 4px 12px; background: #fff; border-top: 1px solid #d1d5db; font-size: 13px; color: #4b5563; }
      .calque { display: flex; justify-content: space-between; }
      #impression { display: none; }
      @media print {
        html, body { height: auto; }
        body { display: block; background: #fff; }
        body > :not(#impression) { display: none; }
        #impression { display: block; }
        #impression img { display: block; }
        #impression p { margin: 2mm 0 0; font-size: 9pt; }
      }
    </style>
    <style id="page"></style>
  </head>
  <body>
    <header>
      <strong>Plan technique</strong>
      <div class="groupe" role="group" aria-label="Étage">
        <select id="etage" class="btn" aria-label="Étage affiché"></select>
        <button id="b-etage-plus" class="icone" title="Ajouter un étage" aria-label="Ajouter un étage">+</button>
        <button id="b-etage-nom" class="icone" title="Renommer l'étage" aria-label="Renommer l'étage">✎</button>
        <button id="b-etage-suppr" class="icone" title="Supprimer l'étage" aria-label="Supprimer l'étage">🗑</button>
      </div>
      <label class="btn principal" title="Image ou PDF : murs, portes, fenêtres et échelle sont reconnus automatiquement">Importer un plan<input id="f-fond" class="vh" type="file" accept="image/*,application/pdf" /></label>
      <div class="groupe" role="group" aria-label="Projet">
        <label class="btn" title="Ouvrir un projet .json">Ouvrir<input id="f-projet" class="vh" type="file" accept=".json,application/json" /></label>
        <button id="b-sauver" title="Enregistrer le projet (Ctrl+S)">Enregistrer</button>
      </div>
      <div class="groupe" role="group" aria-label="Sorties">
        <button id="b-pdf" title="PDF A4 de l'étage, calques visibles seulement">PDF</button>
        <button id="b-csv" title="Nomenclature : quantités et longueurs, tous étages">CSV</button>
        <button id="b-imprimer" title="Imprimer au 1:50, 1:100…">Imprimer</button>
      </div>
      <div class="groupe" role="group" aria-label="Historique">
        <button id="b-annuler" class="icone" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
        <button id="b-refaire" class="icone" title="Rétablir (Ctrl+Y)" aria-label="Rétablir">↷</button>
      </div>
      <button id="b-ajuster" title="Voir tout le plan (touche 0)">Ajuster la vue</button>
    </header>
    <aside>
      <details open>
        <summary>Calques</summary>
        <div id="calques"></div>
      </details>
      <details>
        <summary>Affichage</summary>
        <label>Opacité du fond <input id="opacite" type="range" min="0.1" max="1" step="0.05" value="0.6" /></label>
        <label>Taille des symboles <input id="taille" type="range" min="0.5" max="12" step="0.1" /></label>
      </details>
      <div id="palette"></div>
    </aside>
    <main>
      <div id="plan"></div>
      <section id="props" aria-label="Propriétés de l'élément sélectionné" hidden></section>
    </main>
    <footer><span id="statut"></span><span id="coords"></span></footer>
    <div id="impression"><img id="impression-img" alt="" /><p id="impression-titre"></p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
